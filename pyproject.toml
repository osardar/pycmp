[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pycmp"
version = "0.2.0.dev0"
description = "Research pipeline for comparable graph embeddings of Python artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "tree-sitter>=0.23,<0.27",
  "tree-sitter-python>=0.23,<0.26",
]

[project.optional-dependencies]
benchmark = ["scipy>=1.14"]
retrieval = ["faiss-cpu>=1.9", "numpy>=2.1"]
bytecode = ["xdis", "uncompyle6"]

[project.scripts]
pycmp-codegraph = "codegraph.cli:main"

[tool.setuptools.packages.find]
include = ["codegraph*"]
