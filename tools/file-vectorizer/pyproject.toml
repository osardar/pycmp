[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pycmp-vectorizer"
version = "0.1.0"
description = "Offline, provenance-bearing Python file embeddings"
requires-python = ">=3.14,<3.15"
dependencies = ["torch==2.14.0", "psutil==7.2.2"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
pycmp-vectorizer = "pycmp_vectorizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pycmp_vectorizer = ["*.json"]
